<!DOCTYPE html>

<html lang="fr"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><meta content="#10151c" name="theme-color"/><title>CasaExpats | Plan interactif Afterwork</title><style>*{box-sizing:border-box}body{margin:0;background:#10151c;color:#f6f1e8;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1400px;margin:auto;padding:16px}h1{font-size:clamp(18px,3vw,28px);letter-spacing:.08em;margin:6px 0 4px}p{color:#bcb9b5;margin:0 0 14px}.map{position:relative;width:100%;overflow:hidden;border:1px solid #aa8a5a;border-radius:12px}.map img{display:block;width:100%;height:auto}.hot{position:absolute;border:2px solid transparent;background:transparent;border-radius:9px;cursor:pointer}.hot:hover,.hot:focus-visible{border-color:#ffd48d;background:#e5b46a33;outline:none}.hint{font-size:13px;margin-top:12px;color:#c5b494}.zones{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.zones button{background:#222b32;border:1px solid #96744b;color:#f8ead3;padding:10px 13px;border-radius:24px;cursor:pointer}.zones button:hover{background:#3a342d}dialog{background:#1b232b;color:#fff;border:1px solid #caa66c;border-radius:16px;padding:26px;max-width:min(460px,calc(100vw - 32px));box-shadow:0 20px 80px #0009}dialog::backdrop{background:#000b}dialog h2{color:#e9bd7a;margin:0 36px 12px 0}dialog p{line-height:1.6;color:#e0ddd7}.close{float:right;background:transparent;border:0;color:white;font-size:26px;cursor:pointer}footer{padding:25px 0;color:#9b9995;font-size:12px}@media(max-width:650px){.wrap{padding:8px}.map{border-radius:6px}.hot{border-radius:3px}.hint{padding:4px}.zones button{font-size:13px}dialog{padding:20px}}
/* Repères ajoutés au plan d'origine, sans modifier son image */
.hot{z-index:2}.hot:focus-visible{outline:2px solid #f5c679;outline-offset:2px}
.map .marker{position:absolute;z-index:4;display:flex;align-items:center;justify-content:center;gap:5px;min-width:44px;min-height:28px;padding:5px 8px;border-radius:7px;background:#111820ed;border:1px solid #dbb879;color:#fff;font-weight:800;font-size:clamp(9px,1.05vw,14px);line-height:1.1;box-shadow:0 3px 12px #0008;cursor:pointer}
.map .marker:hover,.map .marker:focus-visible{background:#56401f;outline:2px solid #fff;outline-offset:1px}
.map .marker.wc{left:36%;top:27%}.map .marker.cfg{left:86%;top:25%}
.map .marker.dj-extra{left:48%;top:57%;font-size:clamp(8px,.9vw,12px);background:#30251be8}
@media(max-width:650px){.map .marker{padding:3px 4px;min-width:26px;min-height:20px;font-size:9px;border-radius:4px}.map .marker.wc{left:34%;top:27%}.map .marker.cfg{left:85%;top:25%}.map .marker.dj-extra{left:46%;top:56%;font-size:8px}}

/* Version épurée : aucune rangée d’onglets, zones du plan toujours interactives. */
.zones{display:none!important}
.map{aspect-ratio:8/5}
.map img{width:100%;height:100%;object-fit:contain}
@media (max-width: 800px) and (orientation: portrait){
  .wrap{padding:10px 8px}
  h1{font-size:18px}
  .hint{font-size:12px;margin-top:10px}
}
@media (orientation: landscape) and (max-height: 650px){
  html,body{min-height:100%;}
  .wrap{max-width:none;padding:4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px}
  h1{font-size:clamp(13px,2.6vh,19px);margin:0;line-height:1.15;text-align:center}
  .wrap>p{font-size:clamp(10px,2vh,13px);margin:0 0 2px;text-align:center}
  .map{width:min(100%,calc((100dvh - 64px)*1.6));max-height:calc(100dvh - 64px);flex:none}
  .hint,footer{display:none}
  .map .marker{font-size:clamp(8px,1.5vh,11px);padding:2px 5px;min-height:18px}
  dialog{max-height:90dvh;overflow:auto;padding:16px 20px}
  dialog h2{font-size:19px}
  dialog p{font-size:14px;line-height:1.4}
}

/* Version mobile : plan pré-orienté pour lecture en portrait, sans rotation de l'appareil. */
.map-viewport{width:100%;position:relative}
.hint{margin:12px 0 12px;color:#e9c88e;font-weight:600;text-align:center;font-size:clamp(13px,2.6vw,17px)}
@media (max-width:700px) and (orientation:portrait){
  .wrap{padding:10px 8px 20px}
  .wrap>h1{text-align:center;font-size:17px;line-height:1.3}
  .wrap>p{text-align:center;font-size:12px;margin:5px 0 8px}
  .hint{font-size:13px;line-height:1.4;margin:8px 3px 10px;padding:0}
  .map-viewport{aspect-ratio:5/8;max-width:540px;margin:0 auto;overflow:hidden;border-radius:8px}
  .map-viewport .map{position:absolute;left:100%;top:0;width:160%;height:62.5%;aspect-ratio:8/5;transform:rotate(90deg);transform-origin:top left;border-radius:0}
  .map-viewport .map img{width:100%;height:100%;object-fit:fill}
  .map .marker{font-size:clamp(8px,2vw,12px)}
  dialog{max-height:85dvh;overflow:auto}
}
@media (max-width:700px) and (orientation:landscape){
  .wrap{padding:5px 10px}
  .hint{margin:3px 0;font-size:12px}
}

/* Fenêtre indépendante du plan : son contenu est tourné, pas la boîte de dialogue.
   Cela évite que le navigateur coupe ou masque le texte après publication. */
dialog#detail {
  position:fixed; inset:0; margin:0; padding:0;
  width:100vw; height:100dvh; max-width:none; max-height:none;
  overflow:visible; border:0; border-radius:0;
  background:transparent; color:#fff; box-shadow:none;
}
dialog#detail[open] { display:grid; grid-template-columns:minmax(0,1fr); grid-template-rows:minmax(0,1fr); place-items:center; }
dialog#detail::backdrop { background:rgba(0,0,0,.82); }
.detail-panel {
  position:relative; width:min(490px,calc(100vw - 36px));
  max-height:calc(100dvh - 36px); overflow-y:auto;
  padding:26px 28px 28px;
  border:1px solid #caa66c; border-radius:16px;
  background:#1b232b; color:#fff;
  box-shadow:0 20px 80px rgba(0,0,0,.75);
  overscroll-behavior:contain;
}
.detail-panel h2 { margin:0 42px 14px 0; color:#e9bd7a; font-size:clamp(19px,2.5vw,24px); }
.detail-panel p { color:#f4f1eb; font-size:16px; line-height:1.55; margin:0; }
.detail-panel .close { position:absolute; right:12px; top:10px; float:none; width:38px; height:38px; }
@media (max-width:700px) and (orientation:portrait) {
  .detail-panel {
    width:calc(100dvh - 32px); max-width:none;
    height:min(300px,calc(100vw - 36px));
    display:flex; flex-direction:column; justify-content:center;
    max-height:calc(100vw - 32px);
    padding:18px 24px;
    transform:rotate(90deg);
    transform-origin:center center;
  }
  .detail-panel h2 { font-size:clamp(18px,4.6vw,22px); margin-bottom:10px; }
  .detail-panel p { font-size:clamp(14px,3.6vw,16px); line-height:1.45; }
}

/* Stand tombola ajouté sur le plan existant. */
.map .marker.raffle{left:58%;top:55%;background:#312319f2;border:1px solid #f2c579;color:#ffe5ae;white-space:nowrap;font-size:clamp(9px,1vw,13px)}
@media(max-width:650px){.map .marker.raffle{left:57.5%;top:54%;font-size:9px;padding:3px 5px}}
